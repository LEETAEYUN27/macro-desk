name: 웹사이트 일일 빌드

# 무료 단계 구성
#  1) 매일 07:40 KST : API 를 작업 안에서 잠시 띄워 정적 사이트(out/) 생성
#  2) 결과물을 site 브랜치에 강제 푸시
#  3) Cloudflare Pages 가 site 브랜치 변경을 감지해 자동 배포 (비밀키 불필요)
on:
  schedule:
    - cron: "40 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: API 임시 기동
        working-directory: backend
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8000/api/health && break || sleep 2; done
          curl -fsS localhost:8000/api/dashboard > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 정적 빌드
        working-directory: frontend
        env:
          STATIC_EXPORT: "1"
          API_BASE_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://macro-desk.pages.dev' }}
          NEXT_PUBLIC_CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          NAVER_SITE_VERIFICATION: ${{ vars.NAVER_SITE_VERIFICATION }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          NEXT_PUBLIC_AD_SLOT_TOP: ${{ vars.AD_SLOT_TOP }}
          NEXT_PUBLIC_AD_SLOT_SIDE: ${{ vars.AD_SLOT_SIDE }}
          NEXT_PUBLIC_AD_SLOT_INARTICLE: ${{ vars.AD_SLOT_INARTICLE }}
          NEXT_PUBLIC_CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
          NEXT_PUBLIC_SHOW_AD_PLACEHOLDER: "0"
        run: |
          npm ci
          npm run build
          test -f out/index.html

      - name: site 브랜치로 발행
        working-directory: frontend/out
        run: |
          git init -q
          git checkout -q -b site
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "site: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" site
